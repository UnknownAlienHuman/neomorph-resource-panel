name: One-time make all owned repositories private

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-private-all.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: one-time-private-all-repositories
  cancel-in-progress: true

jobs:
  privatize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_CONFIG_DIR: /tmp/gh-private-all
    steps:
      - name: Request one-time GitHub CLI authorization
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          BROWSER: echo
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          mkdir -p "$GH_CONFIG_DIR"

          auth_log="$RUNNER_TEMP/gh-auth.log"
          : > "$auth_log"

          (
            set +e
            printf '\n' | script -q -e -f -c \
              "gh auth login --hostname github.com --git-protocol https --web --scopes repo --insecure-storage" \
              "$auth_log"
            exit "${PIPESTATUS[1]}"
          ) &
          auth_pid=$!

          device_code=""
          for _ in $(seq 1 60); do
            device_code="$(grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' "$auth_log" | head -n 1 || true)"
            if [[ -n "$device_code" ]]; then
              break
            fi
            if ! kill -0 "$auth_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ -z "$device_code" ]]; then
            echo "GitHub CLI did not produce a device code."
            cat "$auth_log"
            set +e
            wait "$auth_pid"
            set -e
            exit 1
          fi

          issue_payload="$(jq -nc \
            --arg code "$device_code" \
            '{
              title: "ACTION REQUIRED: authorize one-time repository privacy migration",
              body: ("Open `https://github.com/login/device` and enter code **" + $code + "**.\n\nThe code expires in 15 minutes. The workflow verifies that the authorized account is `UnknownAlienHuman`; no access token is printed or committed.")
            }')"

          issue_json="$(curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ACTIONS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" \
            -d "$issue_payload")"

          issue_number="$(jq -r '.number' <<<"$issue_json")"
          echo "AUTH_ISSUE_NUMBER=$issue_number" >> "$GITHUB_ENV"
          echo "Device authorization request published as issue #$issue_number."

          set +e
          wait "$auth_pid"
          auth_status=$?
          set -e

          if ((auth_status != 0)); then
            echo "GitHub CLI authorization failed with status $auth_status."
            exit "$auth_status"
          fi

          actual_login="$(gh api user --jq '.login')"
          if [[ "$actual_login" != "UnknownAlienHuman" ]]; then
            echo "Authorized account '$actual_login'; expected 'UnknownAlienHuman'. Aborting."
            exit 1
          fi

          echo "AUTH_COMPLETE=true" >> "$GITHUB_ENV"
          echo "Authorized as UnknownAlienHuman."

      - name: Make every public owned repository private
        shell: bash
        run: |
          set -euo pipefail

          control_repository="UnknownAlienHuman/neomorph-resource-panel"
          control_visibility="$(gh repo view "$control_repository" --json visibility --jq '.visibility')"
          if [[ "$control_visibility" == "PUBLIC" ]]; then
            echo "Making control repository private first: $control_repository"
            gh repo edit "$control_repository" \
              --visibility private \
              --accept-visibility-change-consequences
          fi

          mapfile -t public_repositories < <(
            gh repo list UnknownAlienHuman \
              --limit 100 \
              --json nameWithOwner,visibility \
              --jq '.[] | select(.visibility == "PUBLIC") | .nameWithOwner'
          )

          echo "Other public repositories found: ${#public_repositories[@]}"
          failures=()

          for repository in "${public_repositories[@]}"; do
            echo "Making private: $repository"
            if ! gh repo edit "$repository" \
              --visibility private \
              --accept-visibility-change-consequences; then
              failures+=("$repository")
            fi
          done

          mapfile -t remaining_public < <(
            gh repo list UnknownAlienHuman \
              --limit 100 \
              --json nameWithOwner,visibility \
              --jq '.[] | select(.visibility == "PUBLIC") | .nameWithOwner'
          )

          if ((${#failures[@]} > 0)); then
            printf 'Failed to change:\n'
            printf '  %s\n' "${failures[@]}"
          fi

          if ((${#remaining_public[@]} > 0)); then
            printf 'Repositories still public:\n'
            printf '  %s\n' "${remaining_public[@]}"
            exit 1
          fi

          echo "PRIVACY_RESULT=success" >> "$GITHUB_ENV"
          echo "All owned repositories are private."

      - name: Redact authorization request and remove temporary credentials
        if: always()
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -u

          if [[ -n "${AUTH_ISSUE_NUMBER:-}" ]]; then
            if [[ "${PRIVACY_RESULT:-}" == "success" ]]; then
              final_title="Completed: one-time repository privacy migration"
              final_body="Authorization code redacted. The one-time migration completed."
            elif [[ "${AUTH_COMPLETE:-}" == "true" ]]; then
              final_title="Failed: one-time repository privacy migration"
              final_body="Authorization code redacted. Authorization succeeded, but the repository migration did not complete."
            else
              final_title="Expired: one-time repository privacy migration"
              final_body="Authorization code redacted. The one-time authorization did not complete."
            fi

            cleanup_payload="$(jq -nc \
              --arg title "$final_title" \
              --arg body "$final_body" \
              '{title: $title, body: $body, state: "closed"}')"

            curl -fsSL \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $ACTIONS_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$AUTH_ISSUE_NUMBER" \
              -d "$cleanup_payload" >/dev/null || true
          fi

          rm -rf "$GH_CONFIG_DIR" "$RUNNER_TEMP/gh-auth.log"
